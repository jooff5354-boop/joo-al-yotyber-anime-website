<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>𝗝𝗢𝗢  𝗔𝗟 𝗬𝗢𝗧𝗬𝗕𝗘𝗥 — المطور</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Tajawal,sans-serif;color:#fff}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#070817}
.bg{position:fixed;inset:0;z-index:-3;background:radial-gradient(circle at 18% 25%,#7135c9aa,transparent 32%),radial-gradient(circle at 85% 72%,#00c6ff55,transparent 30%),linear-gradient(125deg,#08091b,#17103a 45%,#050611);animation:bg 12s ease-in-out infinite alternate}
@keyframes bg{to{filter:hue-rotate(28deg);transform:scale(1.06)}}
.orb{position:fixed;border-radius:50%;filter:blur(3px);opacity:.45;animation:float 9s ease-in-out infinite}.o1{width:260px;height:260px;background:#9d4edd;top:-70px;left:-70px}.o2{width:180px;height:180px;background:#00d4ff;bottom:-40px;right:-30px;animation-delay:-3s}.o3{width:110px;height:110px;background:#ff4ecd;top:35%;right:8%;animation-delay:-6s}@keyframes float{50%{transform:translate(25px,-35px) scale(1.12)}}
.card{width:min(440px,92vw);padding:36px;border:1px solid #ffffff25;border-radius:30px;background:#090b19cc;backdrop-filter:blur(24px);box-shadow:0 25px 90px #0009,0 0 50px #7135c933}
.brand{text-align:center;margin-bottom:28px}.logo{width:78px;height:78px;margin:auto;border-radius:24px;display:grid;place-items:center;font-size:30px;background:linear-gradient(135deg,#7c3aed,#06b6d4);box-shadow:0 0 35px #7c3aed77}.name{font-size:25px;font-weight:900;margin-top:14px;letter-spacing:1px}.sub{color:#aeb4d5;margin-top:5px}
label{display:block;color:#cbd1ef;margin:14px 0 7px;font-size:14px}input{width:100%;padding:14px 15px;border:1px solid #ffffff1c;border-radius:14px;background:#ffffff0b;color:#fff;outline:none;font:inherit}input:focus{border-color:#00d4ff88;box-shadow:0 0 0 3px #00d4ff12}
button{width:100%;border:0;border-radius:14px;padding:14px;margin-top:20px;color:#fff;font:800 15px Tajawal;cursor:pointer;background:linear-gradient(135deg,#7c3aed,#06b6d4);box-shadow:0 10px 30px #7c3aed33}.dev{display:block;text-align:center;margin-top:16px;padding:12px;border:1px solid #ffffff18;border-radius:14px;color:#dfe4ff;text-decoration:none;background:#ffffff08}.dev:hover{background:#ffffff12}.alert{min-height:22px;margin-top:15px;text-align:center;color:#ff9eac}.hint{text-align:center;color:#858dab;font-size:12px;margin-top:20px}

/* JOO anime-night animated background */
body::before{content:"";position:fixed;inset:0;z-index:-4;background:url("/anime_bg.svg") center/cover no-repeat;opacity:.92;pointer-events:none}
body::after{content:"";position:fixed;inset:-20%;z-index:-2;background:radial-gradient(circle at 18% 20%,rgba(174,92,255,.20),transparent 18%),radial-gradient(circle at 78% 70%,rgba(0,229,255,.16),transparent 20%),radial-gradient(circle at 52% 45%,rgba(255,80,190,.10),transparent 16%);filter:blur(24px);animation:jooGlow 12s ease-in-out infinite alternate;pointer-events:none}
@keyframes jooGlow{0%{transform:translate3d(-2%,0,0) scale(1)}50%{transform:translate3d(2%,-2%,0) scale(1.08)}100%{transform:translate3d(-1%,2%,0) scale(1.03)}}

/* ===== JOO AL YOTYBER ANIME UI v3 ===== */
:root{--joo-purple:#9d5cff;--joo-cyan:#36e8ff;--joo-pink:#ff5fbe;--joo-glass:rgba(8,10,28,.76)}
body{background:#05030d!important;position:relative}
body::before{content:"";position:fixed;inset:0;z-index:-10;background:linear-gradient(120deg,rgba(4,3,14,.92),rgba(21,7,42,.82)),url('/anime_bg.svg') center/cover no-repeat;animation:jooAnimePan 18s ease-in-out infinite alternate;transform:scale(1.06)}
body::after{content:"";position:fixed;inset:0;z-index:-9;pointer-events:none;background:radial-gradient(circle at 15% 20%,rgba(157,92,255,.20),transparent 28%),radial-gradient(circle at 85% 70%,rgba(54,232,255,.15),transparent 30%),linear-gradient(115deg,transparent 35%,rgba(255,95,190,.07) 50%,transparent 65%);background-size:140% 140%;animation:jooAura 12s linear infinite}
@keyframes jooAnimePan{0%{background-position:35% 45%;filter:saturate(.9) brightness(.8)}50%{background-position:65% 55%;filter:saturate(1.15) brightness(1)}100%{background-position:45% 35%;filter:saturate(1.25) brightness(.9)}}
@keyframes jooAura{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes jooButtonFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes jooShine{0%{left:-120%}55%,100%{left:120%}}
/* كل الأزرار: شكل بطاقة Anime صغيرة بدل الزر التقليدي */
button,.btn-primary,.btn-secondary,.glow-btn,.action-btn,.tab-btn,.logout-btn,.create-server-btn,.hamburger-btn,.back-home-btn,.contact-btn{position:relative;overflow:hidden;background-image:linear-gradient(135deg,rgba(8,5,24,.90),rgba(43,17,72,.78)),url('/anime_bg.svg')!important;background-size:cover,220% auto!important;background-position:center,60% center!important;border:1px solid rgba(157,92,255,.55)!important;box-shadow:0 6px 20px rgba(74,32,140,.22),inset 0 0 18px rgba(54,232,255,.06)!important;color:#fff!important;border-radius:14px!important;transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease,filter .22s ease!important}
button::after,.btn-primary::after,.btn-secondary::after,.glow-btn::after,.action-btn::after,.tab-btn::after,.logout-btn::after,.create-server-btn::after,.hamburger-btn::after,.back-home-btn::after,.contact-btn::after{content:"";position:absolute;top:-20%;bottom:-20%;width:28%;left:-120%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.28),transparent);transform:skewX(-18deg);animation:jooShine 5.5s ease-in-out infinite;pointer-events:none}
button:hover,.btn-primary:hover,.btn-secondary:hover,.glow-btn:hover,.action-btn:hover,.tab-btn:hover,.logout-btn:hover,.create-server-btn:hover,.hamburger-btn:hover,.back-home-btn:hover,.contact-btn:hover{transform:translateY(-2px) scale(1.015)!important;border-color:rgba(54,232,255,.9)!important;box-shadow:0 10px 28px rgba(96,49,180,.34),0 0 18px rgba(54,232,255,.12)!important;filter:saturate(1.15)}
button:active,.btn-primary:active,.btn-secondary:active,.glow-btn:active{transform:scale(.98)!important}
.tab-btn{min-height:40px!important;padding:9px 14px!important;font-size:.78rem!important}
.glow-btn,.btn-primary,.btn-secondary,.action-btn{min-height:42px!important;padding:9px 15px!important;font-size:.82rem!important}
.create-server-btn{min-height:44px!important;padding:10px 16px!important;font-size:.82rem!important}
.logout-btn{min-height:36px!important;padding:7px 12px!important;font-size:.72rem!important}
.joo-contact-card{position:relative;overflow:hidden;margin:28px 0 8px;padding:18px;border-radius:22px;background:linear-gradient(135deg,rgba(11,7,31,.90),rgba(37,13,57,.82)),url('/anime_bg.svg') center/cover;border:1px solid rgba(157,92,255,.42);box-shadow:0 14px 45px rgba(0,0,0,.28),inset 0 0 28px rgba(54,232,255,.06)}
.joo-contact-title{font-size:1rem;font-weight:900;color:#fff;margin-bottom:5px}.joo-contact-sub{font-size:.72rem;color:#b8b4d0;margin-bottom:13px}.joo-contact-actions{display:flex;gap:9px;flex-wrap:wrap}.joo-contact-btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-width:145px;min-height:40px;padding:8px 13px;text-decoration:none;font-size:.76rem;font-weight:800}.joo-telegram{border-color:rgba(54,190,255,.65)!important}.joo-whatsapp{border-color:rgba(50,220,125,.65)!important}
@media(max-width:600px){.joo-contact-actions{display:grid;grid-template-columns:1fr 1fr}.joo-contact-btn{min-width:0;width:100%;font-size:.7rem}.tab-btn{padding:8px 10px!important}.glow-btn,.btn-primary,.btn-secondary{padding:8px 11px!important}}


/* JOO SHONEN ANIME BUTTON ART */
button,.btn-primary,.btn-secondary,.glow-btn,.action-btn,.tab-btn,.logout-btn,.create-server-btn,.hamburger-btn,.back-home-btn,.contact-btn,.joo-contact-btn{background-image:linear-gradient(90deg,rgba(7,3,18,.88),rgba(24,8,43,.55)),url('/anime_button.svg')!important;background-size:cover,auto 150%!important;background-position:center,center!important;border:1px solid rgba(186,101,255,.7)!important;text-shadow:0 1px 8px #000!important}
button:hover,.btn-primary:hover,.btn-secondary:hover,.glow-btn:hover,.action-btn:hover,.tab-btn:hover,.logout-btn:hover,.create-server-btn:hover,.hamburger-btn:hover,.back-home-btn:hover,.contact-btn:hover,.joo-contact-btn:hover{box-shadow:0 0 0 1px rgba(52,229,255,.45),0 0 25px rgba(158,80,255,.35),inset 0 0 20px rgba(52,229,255,.08)!important}
.joo-anime-badge{display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border-radius:999px;background:rgba(10,5,25,.72);border:1px solid rgba(186,101,255,.45);box-shadow:0 0 18px rgba(186,101,255,.16);font-size:.72rem;font-weight:800}
</style></head><body><div class="bg"></div><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
<main class="card"><div class="brand"><div class="logo">𝗝</div><div class="name">𝗝𝗢𝗢  𝗔𝗟 𝗬𝗢𝗧𝗬𝗕𝗘𝗥</div><div class="sub">لوحة تحكم المطور • JOO</div></div>
<form id="form"><label>يوزر المطور</label><input id="username" value="@JOOFF" autocomplete="username" required><label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password" required><button id="btn">دخول المطور</button></form>
<a class="dev" href="/login">↩️ العودة لتسجيل دخول المستخدم</a><div class="alert" id="alert"></div><div class="hint">الدخول هنا مخصص للمطور لإدارة المستخدمين والخطط</div></main>
<script>
const loginForm=document.getElementById('form');
const usernameInput=document.getElementById('username');
const passwordInput=document.getElementById('password');
const loginBtn=document.getElementById('btn');
const alertBox=document.getElementById('alert');
loginForm.addEventListener('submit',async(e)=>{e.preventDefault();loginBtn.disabled=true;alertBox.textContent='جاري التحقق...';try{const r=await fetch('/api/developer-login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({username:usernameInput.value.trim(),password:passwordInput.value})});const d=await r.json();if(d.success)window.location.replace(d.redirect||'/admin');else{alertBox.textContent=d.message||'بيانات غير صحيحة';loginBtn.disabled=false}}catch(err){alertBox.textContent='تعذر الاتصال بالخادم';loginBtn.disabled=false}});</script></body></html><style>
/* JOO reference artwork skin for developer login */
html,body{background:#02030a!important}
body::before{background:linear-gradient(180deg,rgba(2,3,10,.24),rgba(2,3,10,.55)),url('/assets/login-reference.png') center top/cover no-repeat!important;opacity:1!important;animation:none!important}
body::after{background:radial-gradient(circle at 50% 45%,rgba(0,120,255,.10),transparent 35%)!important;animation:none!important}
.card{width:min(770px,86vw)!important;background:rgba(5,7,24,.66)!important;border:1px solid rgba(92,91,255,.55)!important;box-shadow:0 0 50px rgba(24,60,255,.22),inset 0 0 35px rgba(88,50,255,.08)!important;margin-top:190px!important}
input{background:rgba(4,8,28,.72)!important;border-color:rgba(46,140,255,.65)!important;border-radius:18px!important;height:62px!important}
button{background:linear-gradient(90deg,#6d16ff,#007cff,#16d8ff)!important;border:1px solid #40dfff!important;border-radius:18px!important;height:62px!important}
@media(max-width:600px){.card{width:92vw!important;margin-top:120px!important;padding:24px!important}}
</style>
